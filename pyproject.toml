[tool.poetry]
name = "text-anonymizer"
version = "0.1.0"
description = ""
authors = [
    "Edward Ly <contact@edward.ly>"
]
license = "AGPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
nc-py-api = {version = "^0.31.0", extras = ["app"]}
py3langid = "^0.4.0"
presidio-analyzer = "^2.2.366"
presidio-anonymizer = "^2.2.366"
gliner = "^0.2.30"
# The SentencePiece tokenizer of the GLiNER model needs it; transformers lists it as an extra only.
protobuf = ">=4.25.8"
torch = [
    { version = "2.15.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "2.15.0", markers = "sys_platform != 'linux'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-versions = ["py311"]
preview = true

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["A", "B", "C", "D", "E", "F", "G", "I", "S", "SIM", "PIE", "Q", "RET", "RUF", "UP" , "W"]
extend-ignore = ["D101", "D102", "D103", "D105", "D107", "D203", "D213", "D401", "I001", "RUF100", "D400", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "S101"]

[tool.isort]
profile = "black"

[tool.pylint]
master.py-version = "3.11"
master.extension-pkg-allow-list = ["pydantic"]
design.max-attributes = 8
design.max-locals = 16
design.max-branches = 16
design.max-returns = 8
design.max-args = 7
basic.good-names = [
    "a", "b", "c", "d", "e", "f", "i", "j", "k", "r", "v",
    "ex", "_", "fp", "im", "nc", "ui",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
similarities.min-similarity-lines = 6
messages_control.disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
    "too-many-public-methods",
    "global-statement",
    "broad-exception-caught",
]

[dependency-groups]
dev = [
    "pylint (>=4.1.4,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ex_app/lib"]
markers = [
    "spacy: needs the en_core_web_lg spaCy model, skipped if it is not installed",
]
